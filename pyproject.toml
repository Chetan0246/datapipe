[project]
name = "datapipe"
version = "1.0.0"
description = "Async concurrent data-processing pipeline with worker pools, retries and a Rich CLI"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.7",
    "typer>=0.12",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.scripts]
datapipe = "datapipe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapipe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "S311"]  # asserts in tests; random for simulation/jitter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "B017"]
"src/datapipe/cli.py" = ["B008"]  # typer.Argument/Option in defaults is the typer idiom
